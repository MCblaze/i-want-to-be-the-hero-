<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logan & Friends — Animation Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #091c1c; color: #f9edc9; font: 16px system-ui, sans-serif; }
    main { max-width: 1280px; margin: auto; padding: 30px 24px 60px; }
    header { display: flex; gap: 24px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    h1 { margin: 8px 0; font-size: clamp(28px, 4vw, 42px); }
    h2 { font-size: 16px; margin: 0; }
    .eyebrow { color: #efbd51; font-size: 12px; letter-spacing: .15em; font-weight: 800; }
    a { color: #efbd51; text-underline-offset: 5px; }
    p { color: #aac5b9; }
    button, select { font: inherit; padding: 12px 18px; border: 1px solid #395c51; background: #143b35; color: #f9edc9; border-radius: 6px; cursor: pointer; }
    button[aria-pressed="true"] { background: #efbd51; color: #142e28; border-color: #efbd51; }
    button:focus-visible, select:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    nav, .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 24px 0; }
    .toolbar { justify-content: space-between; }
    .settings { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    article { overflow: hidden; border: 1px solid #315347; border-radius: 10px; background: #102c28; }
    article header { padding: 16px 18px 0; }
    article p { font-size: 13px; margin: 12px 18px 18px; }
    canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
    .badge { font-size: 11px; color: #83b5a2; text-transform: uppercase; letter-spacing: .08em; }
    #error { color: #ffae8e; }
  </style>
</head>
<body>
<main>
  <header>
    <div><span class="eyebrow">I WANT TO BE THE HERO</span><h1>Logan & friends, in motion.</h1></div>
    <a href="index.html">Play the game →</a>
  </header>
  <p>Watch each action. Slow it down, pause, or flip the character.</p>
  <nav aria-label="Choose a character">
    <button data-character="logan" aria-pressed="true">Logan</button>
    <button data-character="thornling" aria-pressed="false">Thornling</button>
    <button data-character="mossback-guardian" aria-pressed="false">Mossback Guardian</button>
  </nav>
  <div class="toolbar">
    <span id="summary"></span>
    <div class="settings">
      <button id="pause" aria-pressed="false">Pause</button>
      <button id="flip" aria-pressed="false">Flip</button>
      <label for="speed">Speed</label>
      <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    </div>
  </div>
  <p id="error" role="alert" hidden></p>
  <section id="clips" aria-label="Animation clips"></section>
</main>
<script src="animation-data.js"></script>
<script src="animations.js"></script>
<script src="animation-preview.js"></script>
</body>
</html>
